name: Popularity Filter Daily Report

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

jobs:
  filter-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Popularity Filter
        run: python scripts/compute_popularity.py

      - name: Run Tests
        run: |
          pip install pytest
          pytest tests/

      - name: Commit & Push Daily Report
        if: github.ref == 'refs/heads/main'
        run: |
          git add -- reports/DEMO_popular_today.md reports/DEMO_popular_today.json
          if git diff --cached --quiet -- reports/DEMO_popular_today.md reports/DEMO_popular_today.json; then
            echo "Daily reports unchanged; skipping commit and push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(report): update daily popular items [skip ci]" -- reports/DEMO_popular_today.md reports/DEMO_popular_today.json
          git push origin main
